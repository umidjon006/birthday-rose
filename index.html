<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">

  <!-- Three.js CDN dan yuklanadi (internet kerak) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="stage" id="stage">

    <!-- Fon nuri -->
    <div class="glow"></div>

    <!-- 3D gul shu canvas'ga chiziladi -->
    <canvas id="gl"></canvas>

    <!-- Yuklanish kartasi -->
    <section class="card" id="card">
      <div class="card-emoji">🌹</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <p class="status" id="status">Ready to compile ...</p>
      <button class="bloom-btn" id="bloomBtn" disabled>Tap to bloom</button>
    </section>

    <!-- Yakuniy matn -->
    <p class="note" lang="ar" dir="rtl">هٰذا مِن أجلِكِ</p>

    <!-- Ko'rsatma: aylantirish / silkitish -->
    <div class="hint" id="hint" aria-live="polite"></div>

    <!-- Ovoz tugmasi -->
    <button class="mute" id="muteBtn" aria-label="Ovoz">🔊</button>

  </main>

  <!-- ES module: Live Server (http://) orqali oching, faylni ikki marta bosib emas -->
  <!-- ?v=4 — fayllarni o'zgartirganda raqamni oshiring (index.html va script.js importlarida), aks holda brauzer eski keshni oladi -->
  <script type="module" src="script.js?v=4"></script>
</body>
</html>
